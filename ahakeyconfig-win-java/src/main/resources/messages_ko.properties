aha.download.body=AhaType 로컬 음성은 이 PC에서 오프라인으로 음성을 인식하여 커서 위치에 입력합니다. 음성 인식 자체에는 인터넷이 필요하지 않습니다.\n\n처음 한 번 ahakey.com에서 음성 모델과 실행 파일(약 260 MB)을 다운로드합니다. 나중에 기기 정보 · 설정 → 로컬 음성에서 삭제할 수 있습니다.\n\nAhaType 클라우드 문장 정리도 함께 켜집니다. AhaType에 로그인하면 인식된 텍스트를 AhaType 클라우드로 전송하여 정리합니다. 로그인하지 않으면 인식된 원문을 입력합니다. K1 패널에서 동작별로 설정할 수 있습니다.\n\n지금 다운로드하고 켤까요?
aha.download.confirm=다운로드하고 켜기
aha.download.cancel=나중에
