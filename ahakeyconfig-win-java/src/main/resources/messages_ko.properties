aha.download.title=AhaType 로컬 음성 인식 켜기
aha.download.header=먼저 로컬 음성 모델을 다운로드해야 해요
aha.download.body=AhaType 로컬 음성 인식은 이 컴퓨터에서 오프라인으로 말을 알아듣고, 커서가 있는 곳에 글자를 입력해요. 인터넷이 없어도 돼요.\n\n처음 켤 때 ahakey.com에서 음성 모델과 실행 파일(약 260 MB)을 다운로드해요. 한 번만 다운로드하면 되고, 나중에 더 보기 → 키보드 정보 · 설정 · 훅 → 로컬 음성 인식에서 지울 수 있어요.\n\nAhaType 클라우드 다듬기도 함께 켜져요. AhaType에 로그인하면 인식한 글을 AhaType 클라우드로 보내 다듬고, 로그인하지 않으면 인식한 글을 그대로 입력해요. 키마다 다듬기를 쓸지는 K1 패널에서 따로 정할 수 있어요.\n\n지금 다운로드하고 켤까요?
aha.download.confirm=다운로드하고 켜기
aha.download.cancel=나중에
