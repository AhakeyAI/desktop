# Local voice is optional and off until the user turns it on in settings,
# which downloads the pack below into %LOCALAPPDATA%\AhaKeyStudio\local-voice.
# model.enabled=false is a developer kill switch that forces it off.
model.enabled=true
model.path=models
model.type=STREAMING_PARAFORMER
tokens.path=tokens.txt
num_threads=4
sample_rate=16000
vad.enabled=false
vad.model.path=silero_vad.onnx
status.poll.period.seconds=5
