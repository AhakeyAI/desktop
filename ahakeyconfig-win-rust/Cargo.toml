[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# BLE
btleplug = "0.11"

# Windows API (版本在 src-tauri/Cargo.toml 中指定 target)
windows = "0.58"

# Audio (可选,本地语音推理使用,当前精简版未启用)
# cpal = "0.15"

# Utilities
anyhow = "1"
thiserror = "1"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
