[package]
name = "ahakey-speech"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native microphone capture and offline SenseVoice speech for AhaKey"

[dependencies]
anyhow = "1"
cpal = "0.15.3"
sherpa-onnx = { version = "=1.13.7", default-features = false, features = ["shared"] }
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
hound = "3.5"
