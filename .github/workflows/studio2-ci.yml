name: AhaKey Studio alpha
on:
  push:
    paths:
      - 'src/AhaKey.*/**'
      - 'tests/AhaKey.*/**'
      - 'AhaKeyStudio.sln'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/studio2-ci.yml'
      - 'Publish-Studio.ps1'
      - 'docs/studio2/**'
  pull_request:
    paths:
      - 'src/AhaKey.*/**'
      - 'tests/AhaKey.*/**'
      - 'AhaKeyStudio.sln'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/studio2-ci.yml'
      - 'Publish-Studio.ps1'
      - 'docs/studio2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore AhaKeyStudio.sln
      - name: Build
        run: dotnet build AhaKeyStudio.sln --configuration Release --no-restore
      - name: Test software only
        run: dotnet test AhaKeyStudio.sln --configuration Release --no-build --logger "trx;LogFilePrefix=studio2"
      - name: WPF mock regression (no hardware)
        shell: pwsh
        run: |
          dotnet "src/AhaKey.Studio/bin/Release/net10.0-windows10.0.19041.0/AhaKey Studio.dll" --smoke-test artifacts/studio2-mock
          if ($LASTEXITCODE -ne 0) { throw "Studio smoke test failed" }
      - name: Publish self-contained alpha
        shell: pwsh
        run: ./Publish-Studio.ps1 -PublicRelease
      - name: USB and BLE ownership replay (no hardware)
        shell: pwsh
        run: |
          dotnet "src/AhaKey.Studio/bin/Release/net10.0-windows10.0.19041.0/AhaKey Studio.dll" --usb-diagnostics-smoke artifacts/studio2-usb-replay
          if ($LASTEXITCODE -ne 0) { throw "USB replay failed" }

      - name: Library and profile regression (no hardware)
        shell: pwsh
        run: |
          dotnet "src/AhaKey.Studio/bin/Release/net10.0-windows10.0.19041.0/AhaKey Studio.dll" --phase8-repro artifacts/studio2-library asset
          if ($LASTEXITCODE -ne 0 -or (Get-Content artifacts/studio2-library/result.txt) -ne 'completed') { throw "Library regression failed" }
      - name: Package public Windows alpha
        shell: pwsh
        run: |
          if (Test-Path artifacts/public-runtime/FirmwarePackages) { throw "Restricted firmware must not be published" }
          Compress-Archive -LiteralPath artifacts/public-runtime -DestinationPath artifacts/AhaKeyStudio-2.0.0-alpha.9-win-x64-public.zip
          $hash = Get-FileHash artifacts/AhaKeyStudio-2.0.0-alpha.9-win-x64-public.zip -Algorithm SHA256
          "$($hash.Hash)  AhaKeyStudio-2.0.0-alpha.9-win-x64-public.zip" | Set-Content artifacts/SHA256SUMS.txt
      - name: Upload public preview
        uses: actions/upload-artifact@v4
        with:
          name: AhaKeyStudio-2.0.0-alpha.9-win-x64-public
          if-no-files-found: error
          path: |
            artifacts/AhaKeyStudio-2.0.0-alpha.9-win-x64-public.zip
            artifacts/SHA256SUMS.txt
