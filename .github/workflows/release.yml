name: Build signed macOS release candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git rev-list --count 需要完整历史

      - name: Resolve version from tag
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          match = re.fullmatch(r'v([0-9]+\.[0-9]+\.[0-9]+)(?:-(?:alpha|beta|rc)[0-9.]*)?', os.environ['GITHUB_REF_NAME'])
          if not match:
              raise SystemExit('Expected a numeric version with optional alpha/beta/rc release label')
          # Apple bundle/catalog compatibility use the numeric version. The
          # prerelease label belongs to the Git tag and release classification.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + match.group(1) + '\n')
          PY

      - name: Check release secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/ahakey-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          echo "MACOS_CI_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Configure Apple notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "AhaKeyNotaryCI" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$MACOS_CI_KEYCHAIN" \
            --validate

      - name: Build, sign, notarize, and package DMG
        working-directory: ahakeyconfig-mac
        env:
          DMG_BASENAME: AhaKey-Studio-macOS
          APP_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_IDENTITY_HINT: P2VFVRZK7P
          NOTARY_PROFILE: AhaKeyNotaryCI
        run: |
          chmod +x scripts/build.sh scripts/package_dmg.sh scripts/pack-release.sh
          zsh scripts/pack-release.sh

      # This is the exact installer to test. Promotion must not rebuild it.
      - name: Store signed candidate for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: AhaKey-signed-candidate-${{ github.ref_name }}
          path: ahakeyconfig-mac/dist/AhaKey-Studio-macOS.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${MACOS_CI_KEYCHAIN:-}" && -f "$MACOS_CI_KEYCHAIN" ]]; then
            security delete-keychain "$MACOS_CI_KEYCHAIN" || true
          fi
