# ============================================================
# AhaKey Studio 模型配置文件
# 所有配置项均可在运行时修改，无需重新编译
# ============================================================

# ------------------------------
# 设备状态配置
# ------------------------------

# 设备状态轮询周期（秒）
# 控制应用定期查询蓝牙设备状态的间隔时间
status.poll.period.seconds=5

# ------------------------------
# 语音识别模型配置
# ------------------------------

# 是否启用本地语音识别模型
# true: 启用本地模型，按下录音键时使用本地识别
# false: 禁用本地模型，按下录音键时使用系统语音（Win+H）
model.enabled=true

# 模型文件所在目录路径（相对于应用程序根目录）
# 开发环境: models 或 src/main/resources/models
# 打包后: 应用程序同级目录下的 models 文件夹
model.path=models

# 模型类型
# STREAMING_PARAFORMER: 流式 Paraformer 模型（实时识别）
# SENSE_VOICE: SenseVoice 模型（非流式，完整录音后识别）
model.type=STREAMING_PARAFORMER

# 词汇表文件路径（相对于 model.path）
# 包含模型使用的所有词元（tokens）定义
tokens.path=tokens.txt

# 语音识别使用的线程数
# 值越大识别速度越快，但占用CPU资源越多
# 建议设置为 CPU 核心数的一半到全部
num_threads=4

# 音频采样率（赫兹）
# 必须与模型训练时使用的采样率一致
# 目前支持的模型均为 16000 Hz
sample_rate=16000

# ------------------------------
# VAD（语音活动检测）配置
# ------------------------------

# 是否启用语音活动检测
# true: 启用VAD，自动检测语音开始和结束，实现连续录音
# false: 禁用VAD，手动控制录音开始和结束
vad.enabled=false

# VAD 模型文件路径（相对于应用程序根目录）
# 使用 Silero VAD 模型进行语音活动检测
vad.model.path=models/silero_vad.onnx

# ------------------------------
# 标点符号模型配置
# ------------------------------

# 是否启用标点符号恢复
# true: 识别完成后自动添加标点符号
# false: 不添加标点符号，输出纯文本
punct.enabled=true

# 标点符号模型文件路径（相对于应用程序根目录）
# 用于在识别结果中自动添加标点符号，提升文本可读性
punct.model.path=models/punct_model.onnx

# ------------------------------
# 日志配置
# ------------------------------

# 日志级别说明：
# OFF: 关闭所有日志输出
# ERROR: 仅输出错误信息
# WARN: 输出警告和错误信息
# INFO: 输出一般信息、警告和错误（推荐生产环境使用）
# DEBUG: 输出调试信息、一般信息、警告和错误（推荐开发环境使用）
# TRACE: 输出所有日志信息（最详细，性能开销最大）

# 主应用日志级别（com.example.ahakey 包）
log.level.app=DEBUG

# 根日志级别（未指定包的日志）
log.level.root=INFO

# Jackson JSON 库日志级别
log.level.jackson=WARN

# JNA 库日志级别
log.level.jna=WARN

# JavaFX 库日志级别
log.level.javafx=WARN

# ------------------------------
# 日志文件配置
# ------------------------------

# 日志文件路径（相对于应用程序根目录）
log.file.path=logs/ahakey-studio.log

# 日志文件命名模式（按日期滚动）
log.file.pattern=logs/ahakey-studio.%d{yyyy-MM-dd}.log

# 日志文件保留天数
log.file.maxHistory=30

# 日志文件总大小上限
log.file.totalSizeCap=100MB

# ------------------------------
# 语音触发模式配置
# ------------------------------

# 录音按键触发模式
# hold: 长按模式，按下开始录音，释放停止录音
# toggle: 点击切换模式，点击一次开始录音，再点击一次停止录音
voice.trigger.mode=toggle

# ------------------------------
# 识别结果简繁模式配置
# ------------------------------

# 语音识别结果输出简繁模式
# simplified: 简体输出（默认，识别结果原样输出）
# traditional: 繁体输出（识别结果经 OpenCC 简繁转换后输出）
voice.chinese.mode=simplified
