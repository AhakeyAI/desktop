<div class="app">
<header><h1>AhaKey Studio</h1><div class="status muted">已连接<br><span class="online">● AhaKey 505C</span></div><div class="status muted">电量<br>● 67%</div><div class="status muted">拨杆<br><span class="online">● 自动批准</span></div><div class="tools"><span class="status muted">键盘控制中<br>Agent 正在控制键盘</span><button id="settings" title="设置" aria-label="设置">•••⌄</button></div></header>
<div class="work"><div class="canvas"><div class="modes"><span>Claude</span><span>Cursor</span><span class="active">Codex</span><span>Kimi</span></div><p class="hint">针对 Codex 终端审批：Key2 发送 ↵ 确认，Key3 发送 Esc 取消。</p><div class="keyboard"><div class="top-hardware"><div class="led"></div><div class="screen">▰</div></div><div class="keys"><span class="key">♩</span><span class="key">✓</span><span class="key">×</span><span class="key">⌫</span><span class="mode-key">↻</span></div></div><p class="hint">点按拨杆查看实体档位；其他部件可进入对应配置。</p></div><aside class="aside"><div class="aside-body" id="standby"></div><div class="aside-footer" id="standbyFooter"></div></aside></div>
<div class="app-footer">↻ 模式与待机 · Mode 3　│　未同步改动 3　│　草稿保留，仅读取、写入或预览时临时连接键盘。<span class="watermark">交互原型 · 不连接真实键盘</span></div></div>
<div id="menu"></div><div id="modal"></div>
<div class="proto-state" id="state"></div>
<div class="prototype-bar"><button id="prev" aria-label="上一个布局">←</button><strong id="variant"></strong><button id="next" aria-label="下一个布局">→</button><span style="color:#aaa">│</span><button id="showBrowse">待机浏览</button><button id="showEdit">待机修改</button><button id="showReset">恢复弹窗</button><select id="simulate" aria-label="模拟设备状态"><option value="ready">模拟：就绪</option><option value="offline">模拟：未连接</option><option value="unsupported">模拟：旧固件不支持</option><option value="unfinished">模拟：上次未完成</option></select></div>
<script>
const names={A:'A · 精简确认',B:'B · 两步引导',C:'C · 设备与影响分栏'};
let variant=new URL(location).searchParams.get('variant')||'A';if(!names[variant])variant='A';
let state={surface:'reset',menu:false,current:60,draft:60,reading:false,device:'ready',usb:false,step:0,confirm:false,phase:'ready',restores:0};
const el=id=>document.getElementById(id);
const time=value=>value===0?'不自动待机':value+' 分钟';
function readIcon(){return '<button class="ghost" id="refreshStandby" title="重新读取" aria-label="重新读取"><span class="'+(state.reading?'spinner':'')+'">↻</span></button>'}
function standby(){let editing=state.surface!=='browse';el('standby').innerHTML='<h2>↻ 模式与待机</h2>'+(editing?'<h3>待机时间</h3><p class="muted small">全局设置，应用到所有模式。</p><div class="readline"><span>'+ (state.reading?'正在读取当前设置…':'已读取当前设置：'+time(state.current))+'</span>'+readIcon()+'</div><div class="formrow"><span>待机时间</span><select id="standbyDraft"><option value="0">不自动待机</option><option value="30">30 分钟</option><option value="60">60 分钟</option><option value="120">120 分钟</option></select></div>':'<div class="summary-row"><span class="muted">待机时间</span><span class="value">'+time(state.current)+'</span></div><div class="summary-row"><span class="muted">应用范围</span><span class="value">全部模式</span></div>');
el('standbyFooter').innerHTML=editing?'<button id="backStandby">返回</button><button id="writeStandby" class="blue" '+(state.draft===state.current?'disabled':'')+'>写入键盘</button>':'<span></span><button class="blue" id="editStandby">修改</button>';if(el('standbyDraft'))el('standbyDraft').value=String(state.draft)}
function deviceBlock(){let title=state.device==='offline'?'键盘未连接':state.device==='unsupported'?'当前固件暂不支持':state.device==='unfinished'?'上次恢复未完成':'可以恢复';return '<div class="device"><span class="device-icon">⌨</span><div><b>AhaKey 505C</b><p class="small muted">整把键盘 · 全部模式</p></div><div class="right" style="'+(state.device==='ready'?'':'color:#d9ad81')+'">'+title+'<button class="ghost" id="checkDevice" title="重新读取" aria-label="重新读取恢复状态">↻</button></div></div>'}
function effects(){return '<div class="impact"><span><b>⌨</b>全部模式键位</span><span><b>♩</b>语音方案</span><span><b>◷</b>待机与拨杆</span><span><b>▱</b>画面与灯光</span></div>'}
function keepDraft(){return '<div class="preserve">✓ 电脑上的草稿会保留，不会同时写入键盘。</div>'}
function power(){return '<label class="power"><input id="usb" type="checkbox" '+(state.usb?'checked':'')+'><span>键盘已通过 USB 供电，并会保持连接</span></label><p class="subnote">保持蓝牙连接，无需进入烧录模式。</p>'}
function notice(){return state.device==='offline'?'<p class="alert-note">请先让键盘开机连接，再重新检查。</p>':state.device==='unsupported'?'<p class="alert-note">请使用支持恢复功能的固件。不会执行清除。</p>':state.device==='unfinished'?'<p class="alert-note">可以重新恢复。开始前请确认供电稳定。</p>':''}
function canRestore(){return state.usb&&['ready','unfinished'].includes(state.device)&&state.phase==='ready'}
function footer(primary,disabled,action){return '<div class="dialog-footer"><button id="cancel">取消</button><div class="right">'+(variant==='B'&&state.step===1?'<button id="backStep">上一步</button>':'')+'<button id="'+action+'" class="'+(action==='nextStep'?'blue':'danger')+'" '+(disabled?'disabled':'')+'>'+primary+'</button></div></div>'}
function confirm(){return state.confirm?'<div class="confirm-box"><p><b>确认恢复整把键盘？</b><br>所有模式的键盘设置将恢复默认，自定义画面停止使用。此操作无法撤销。</p><div class="confirm-actions"><button id="cancelConfirm">取消</button><button id="confirmReset" class="danger">确认恢复</button></div></div>':''}
function variantA(){return '<div class="dialog-head"><h2>恢复出厂设置</h2><button id="close" aria-label="关闭">×</button></div><div class="dialog-body">'+deviceBlock()+notice()+'<p>恢复键盘的默认设置，自定义画面将停止使用。</p>'+effects()+keepDraft()+power()+confirm()+'</div>'+footer('恢复出厂设置',!canRestore()||state.confirm,'requestReset')}
function variantB(){return '<div class="dialog-head"><h2>恢复出厂设置</h2><button id="close" aria-label="关闭">×</button></div><div class="dialog-body"><div class="steps"><span class="'+(state.step===0?'now':'')+'"><b>1</b>确认影响</span><span class="'+(state.step===1?'now':'')+'"><b>2</b>准备与恢复</span></div>'+(state.step===0?'<div class="large-warning">↺</div><h3>让整把键盘回到默认设置</h3><p class="muted small" style="margin-top:10px">影响所有模式；自定义画面会停止使用。</p>'+effects()+keepDraft():deviceBlock()+notice()+'<div class="review-list"><div><span class="muted">恢复范围</span><span>整把键盘</span></div><div><span class="muted">本地草稿</span><span>保留</span></div></div>'+power())+'</div>'+footer(state.step===0?'下一步':'确认恢复',state.step===0?false:!canRestore(),state.step===0?'nextStep':'confirmReset')}
function variantC(){return '<div class="dialog-head"><h2>恢复出厂设置</h2><button id="close" aria-label="关闭">×</button></div><div class="split"><div class="split-left"><span style="font-size:34px">⌨</span><h3>AhaKey 505C</h3><p>恢复作用于整把键盘，所有模式一起生效。</p><div class="scope-tags"><span>Claude</span><span>Cursor</span><span>Codex</span><span>Kimi</span></div><button class="ghost" id="checkDevice" title="重新读取">↻ 重新检查连接</button></div><div class="split-right"><h3>将恢复的内容</h3>'+effects()+'<p class="small muted" style="margin-bottom:16px">自定义画面停止使用。恢复后按键盘提示重新选择平台。</p>'+notice()+keepDraft()+power()+confirm()+'</div></div>'+footer('恢复出厂设置',!canRestore()||state.confirm,'requestReset')}
function result(){let loading=state.phase==='working';return '<div class="dialog-head"><h2>恢复出厂设置</h2></div><div class="dialog-body done"><div class="check '+(loading?'spinner':'')+'">'+(loading?'↻':'✓')+'</div><h3>'+(loading?'正在恢复键盘…':'已恢复出厂设置')+'</h3><p>'+(loading?'请保持 USB 供电，暂时不要操作键盘。':'键位、语音、待机、拨杆和显示灯光已核对。<br>本地草稿已保留。')+'</p></div><div class="dialog-footer"><span class="muted small">'+(loading?'原型模拟，不连接设备':'请按键盘提示重新选择平台')+'</span>'+(loading?'':'<div class="right"><button id="again" class="ghost">再次恢复…</button><button class="blue" id="finish">完成</button></div>')+'</div>'}
function render(){el('variant').textContent=names[variant];el('simulate').value=state.device;standby();el('menu').innerHTML=state.menu?'<div class="settings-menu"><button id="openReset">恢复出厂设置…</button><button disabled>固件升级…</button><button disabled>设备信息…</button></div>':'';el('modal').innerHTML=state.surface==='reset'?'<div class="overlay"><div role="dialog" aria-modal="true" aria-label="恢复出厂设置" class="dialog '+(variant==='C'?'wide':'')+'">'+(state.phase==='ready'?({A:variantA,B:variantB,C:variantC}[variant]()):result())+'</div></div>':'';el('state').textContent='原型状态（非产品界面） '+JSON.stringify(state);wire()}
function openReset(){state.surface='reset';state.menu=false;state.usb=false;state.confirm=false;state.step=0;state.phase='ready';render()}
function closeReset(){state.surface='edit';state.usb=false;state.confirm=false;render()}
function restore(){if(!canRestore())return;state.phase='working';state.confirm=false;render();setTimeout(()=>{state.phase='done';state.restores++;render()},1000)}
function wire(){const on=(id,fn)=>{if(el(id))el(id).onclick=fn};on('settings',()=>{state.menu=!state.menu;render()});on('openReset',openReset);on('close',closeReset);on('cancel',closeReset);on('cancelConfirm',()=>{state.confirm=false;render()});on('requestReset',()=>{if(canRestore()){state.confirm=true;render()}});on('confirmReset',restore);on('nextStep',()=>{state.step=1;render()});on('backStep',()=>{state.step=0;render()});on('again',openReset);on('finish',closeReset);on('checkDevice',()=>{state.usb=false;state.confirm=false;render()});on('refreshStandby',()=>{state.reading=true;render();setTimeout(()=>{state.reading=false;render()},650)});on('backStandby',()=>{state.surface='browse';render()});on('editStandby',()=>{state.surface='edit';render()});on('writeStandby',()=>{state.current=state.draft;state.surface='browse';render()});if(el('usb'))el('usb').onchange=e=>{state.usb=e.target.checked;render()};if(el('standbyDraft'))el('standbyDraft').onchange=e=>{state.draft=+e.target.value;render()}}
function change(d){const keys=['A','B','C'];variant=keys[(keys.indexOf(variant)+d+3)%3];const u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);state.usb=false;state.confirm=false;state.step=0;state.phase='ready';render()}
el('prev').onclick=()=>change(-1);el('next').onclick=()=>change(1);el('showBrowse').onclick=()=>{state.surface='browse';state.confirm=false;render()};el('showEdit').onclick=()=>{state.surface='edit';state.confirm=false;render()};el('showReset').onclick=openReset;el('simulate').onchange=e=>{state.device=e.target.value;state.usb=false;state.confirm=false;state.phase='ready';render()};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();change(-1)}if(e.key==='ArrowRight'){e.preventDefault();change(1)}});render();
</script>
</html>
