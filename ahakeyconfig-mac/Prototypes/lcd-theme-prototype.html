<div class="app"><header><h1>AhaKey Studio</h1><small id="connected"><span class="green">●</span> 已连接</small><small>82% · 自动批准</small><small style="margin-left:auto">connect&amp;talk · 原型，不连接键盘</small></header><div class="content"><main class="canvas"><h2>Keyboard Mode</h2><div class="mode-tabs"><button data-keyboard-mode="0">Claude</button><button data-keyboard-mode="1">Cursor</button><button data-keyboard-mode="2" class="selected">Codex</button><button data-keyboard-mode="3">custom</button></div><p>点按屏幕，在右侧「修改」里编辑显示。</p><div class="keyboard"><div class="keyboard-top"><div class="strip"></div><div class="screen" id="keyboardScreen"><canvas id="lcd" width="160" height="80" aria-label="虚拟键盘屏幕，当前画面"></canvas><img id="modeArtwork" alt="当前 Mode 的默认画面" style="display:none;width:160px;height:80px;object-fit:contain;background:#000" /></div></div><div class="keys"><button data-key="0" aria-label="虚拟语音键">♩</button><button data-key="1" aria-label="虚拟 Enter，系统确认时选择是">↵</button><button data-key="2" aria-label="虚拟 Escape，系统确认时选择否">⎋</button><button data-key="3" aria-label="虚拟退格键">⌫</button><button class="power-key" id="power" aria-label="虚拟电源键，关机时短按开机，开机后短按切换 Mode，长按两秒关机" title="关机时短按开机；开机后短按切换 Mode；按住 2 秒模拟关机">⏻<div class="power-hold-line"><i></i></div></button></div></div><div class="simulation-hint"><strong id="sceneLabel">画面播放</strong><span>短按开机／切 Mode · 长按关机</span></div><div class="simulation-controls"><button id="daily">日常界面</button><button id="connect">模拟连接</button><button id="system">选择系统</button><button id="restart">重播开机</button></div></main><aside class="aside"><div class="aside-head"><h2 class="inspector-title">▣ 屏幕显示</h2></div><div class="scroll" id="editor"></div><div class="footer"><p>图片与展示方式的修改在此写入。</p><div class="footer-actions"><button id="back">返回</button><button class="primary" id="write">写入键盘</button></div></div></aside></div></div>
<div class="prototype-state" id="state" style="margin:0 30px 85px"></div><nav class="switcher"><span>A · 单行主题选择</span><small>演示状态</small><select id="scenario"><option value="ready">已读取</option><option value="unknown">未确认能力</option><option value="offline">未连接</option><option value="fail">保存失败</option></select></nav>
<script src="hardware-ui-theme-reference.prototype.js"></script>
<script>
// One in-memory simulation. Theme preview, power/connection/system scenes never send device commands.
const data={variant:'A',theme:'dark',confirmedTheme:'dark',keyboardMode:2,mode:'single',scenario:'ready',saving:false,message:'',editing:true,powered:true,connected:true,system:'Mac',scene:'image',generation:0};
const params=new URLSearchParams(location.search);params.set('variant','A');history.replaceState(null,'','?'+params);
let sceneTimer=null,saveTimer=null,holdTimer=null,held=false,holdStarted=false;
const modeNames=['Claude','Cursor','Codex','custom'];
const sceneNames={image:'画面播放',daily:'日常界面',boot:'开机动画',shutdown:'关机动画',off:'已关机',reconnect:'连接中',mac:'选择电脑系统 · Mac',win:'选择电脑系统 · Windows'};
function setScene(scene,after=0,next=null){clearTimeout(sceneTimer);data.generation++;const generation=data.generation;data.scene=scene;render();if(after)sceneTimer=setTimeout(()=>{if(data.generation===generation){if(typeof next==='function')next();else setScene(next)}},after)}
function daily(){if(!data.powered)return;setScene('daily',2200,'image')}
function boot(){data.powered=true;setScene('boot',300,()=>{if(data.connected)daily();else connecting()})}
function shutdown(){if(!data.powered)return;setScene('shutdown',750,()=>{data.powered=false;data.connected=false;setScene('off')})}
function connecting(){if(!data.powered){boot();return}data.connected=false;setScene('reconnect',1300,()=>{data.connected=true;if(data.system)daily();else setScene('mac')})}
function systemChoice(yes){if(!['mac','win'].includes(data.scene))return;if(yes){data.system=data.scene==='mac'?'Mac':'Windows';data.connected=true;data.message='模拟已选择 '+data.system;daily()}else setScene(data.scene==='mac'?'win':'mac')}
function selectKeyboardMode(mode){if(!data.powered||mode===data.keyboardMode)return;data.keyboardMode=mode;setScene('daily',1100,'image')}
function shortPower(){if(!data.powered){boot();return}selectKeyboardMode((data.keyboardMode+1)%4)}
function text(screen,x,y,t,size=14,color=screen.p.fg){const f=R4_FONTS[size];for(const c of t){const g=f.glyphs[c.charCodeAt(0)]||f.glyphs[63];for(let yy=0;yy<f.h;yy++)for(let xx=0;xx<g.w;xx++)if(g.r[yy]&(1<<xx))screen.pixel(x+xx,y+yy,color);x+=g.a}}
function textWidth(t,size){return [...t].reduce((n,c)=>n+(R4_FONTS[size].glyphs[c.charCodeAt(0)]||R4_FONTS[size].glyphs[63]).a,0)}
function centered(screen,y,t,size=14,color=screen.p.fg){text(screen,Math.floor((160-textWidth(t,size))/2),y,t,size,color)}
function drawScreen(){const canvas=document.querySelector('#lcd'),image=document.querySelector('#modeArtwork');if(!canvas)return;let scene=data.scene,s;const artwork=['claude_0.gif','cursor.gif','codex.gif',null][data.keyboardMode];if(scene==='image'&&artwork){canvas.style.display='none';image.style.display='block';if(image.dataset.mode!==String(data.keyboardMode)){image.src='default-oled-assets/'+artwork;image.dataset.mode=String(data.keyboardMode)}image.alt='Mode '+(data.keyboardMode+1)+' · '+['Claude','Cursor','Codex','custom'][data.keyboardMode]+' 的默认画面';return}canvas.style.display='block';image.style.display='none';if(scene==='image'){s=HardwareUIPreview.render('sleep',data.theme,'S',{},PREVIEW_ASSETS);centered(s,20,'Custom',20);centered(s,49,'No artwork',12,s.p.muted)}else{s=ReadabilityR4.render({daily:'keys',shutdown:'offAnim',off:'sleep'}[scene]||scene,data.theme,{battery:82,mode:data.keyboardMode+1,link:data.connected?'BT OK':'BT --',labels:['Voice','Enter','Escape','Backspace']},PREVIEW_ASSETS,R4_FONTS)}
if(['mac','win'].includes(scene)){s.fill(0,13,160,41,s.p.bg);centered(s,14,'Computer is',14);centered(s,32,scene==='mac'?'Mac?':'Windows?',20)}
if(scene==='reconnect'){s.fill(0,16,160,26,s.p.bg);centered(s,18,'Reconnecting',18);const dot=Math.floor(Date.now()/250)%3;for(let i=0;i<3;i++)s.fill(68+i*10,73,4,3,i===dot?s.p.blue:s.p.line)}
canvas.getContext('2d').putImageData(new ImageData(s.data,160,80),0,0);canvas.setAttribute('aria-label','虚拟键盘屏幕：'+sceneNames[scene]+'，'+(data.theme==='light'?'浅色':'深色')+'主题');}
function render(){document.querySelectorAll('[data-keyboard-mode]').forEach(button=>button.classList.toggle('selected',Number(button.dataset.keyboardMode)===data.keyboardMode));document.querySelector('#connected').textContent=data.connected?'● 已连接':'○ 未连接';document.querySelector('#sceneLabel').textContent='M'+(data.keyboardMode+1)+' · '+sceneNames[data.scene];document.querySelector('#keyboardScreen').className='screen '+data.scene;document.querySelector('#editor').innerHTML=data.editing?`<section class="module"><div class="theme-row"><b>主题风格：</b><div class="theme-tabs segmented" role="tablist" aria-label="主题风格">${[['light','Light 浅色'],['dark','Dark 深色']].map(([v,t])=>`<button role="tab" aria-selected="${data.theme===v}" data-theme="${v}" class="${data.theme===v?'selected':''}" ${data.saving||['offline','unknown'].includes(data.scenario)?'disabled':''}>${t}</button>`).join('')}</div><button id="read" title="重新读取设备主题" ${data.saving||data.scenario==='offline'?'disabled':''}>↻</button></div>${/未确认|未连接|需要升级/.test(data.message)?`<p class="theme-feedback" role="status">${data.message}</p>`:''}<div class="display-mode-row"><b>显示模式</b><div class="segmented"><button class="${data.mode==='single'?'selected':''}" data-mode="single">单任务</button><button class="${data.mode==='multi'?'selected':''}" data-mode="multi">多任务</button></div></div><div class="states three">${['进行中','等待处理','已完成'].map((s,i)=>`<button class="state ${i===0?'active':''}" data-artwork="${i}"><div class="thumb">${['◉','◷','✓'][i]}</div>${s}<small>默认素材</small></button>`).join('')}</div><div class="preview" style="height:110px">🦀<p>选择图片或 GIF…</p></div><p>已完成画面也用于键盘默认画面。</p>${data.mode==='multi'?'<label class="toggle"><input type="checkbox"> 跟随当前终端</label>':''}<div class="row" style="margin-top:16px"><button class="link" id="readArtwork">读取键盘画面</button><button class="link" id="restore">使用默认素材</button></div><p class="secondary">最多 12 帧 · 10 FPS</p></section>`:'<section class="module"><h3>屏幕显示</h3><p>单任务 · 当前模式的图片与动图</p><button id="edit">修改</button></section>';
document.querySelector('#state').textContent='原型状态（非正式界面）：'+JSON.stringify(data);document.querySelectorAll('[data-theme]').forEach(e=>e.onclick=()=>stageTheme(e.dataset.theme));document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{data.mode=e.dataset.mode;render()});const read=document.querySelector('#read');if(read)read.onclick=()=>{data.scenario='ready';data.message='已读取键盘主题';document.querySelector('#scenario').value='ready';render()};const edit=document.querySelector('#edit');if(edit)edit.onclick=()=>{data.editing=true;render()};drawScreen();}
function stageTheme(theme){if(data.saving)return;data.theme=theme;data.message='';if(data.powered)daily();else render()}
function submitDraft(){if(data.saving)return;data.saving=true;data.message='正在写入…';render();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{data.saving=false;if(data.scenario==='fail'){data.message='写入未确认，主题草稿保留，请重新读取并重试。'}else{data.confirmedTheme=data.theme;data.message='原型演示：草稿已写入键盘'}render()},700)}
const power=document.querySelector('#power');function hold(){if(holdStarted)return;holdStarted=true;held=false;power.classList.add('holding');holdTimer=setTimeout(()=>{held=true;shutdown()},2000)}function release(){clearTimeout(holdTimer);power.classList.remove('holding');if(holdStarted&&!held)shortPower();holdStarted=false}power.onpointerdown=e=>{e.preventDefault();power.setPointerCapture(e.pointerId);hold()};power.onpointerup=e=>{e.preventDefault();release()};power.onpointercancel=()=>{clearTimeout(holdTimer);holdStarted=false;power.classList.remove('holding')};power.onkeydown=e=>{if([' ','Enter'].includes(e.key)&&!e.repeat){e.preventDefault();hold()}};power.onkeyup=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();release()}};
document.querySelectorAll('[data-keyboard-mode]').forEach(tab=>tab.onclick=()=>selectKeyboardMode(Number(tab.dataset.keyboardMode)));document.querySelectorAll('[data-key]').forEach(key=>key.onclick=()=>{if(!data.powered)return;if(['mac','win'].includes(data.scene)){if(key.dataset.key==='1')systemChoice(true);else if(key.dataset.key==='2')systemChoice(false)}else daily()});document.querySelector('#daily').onclick=daily;document.querySelector('#connect').onclick=connecting;document.querySelector('#system').onclick=()=>{if(!data.powered)data.powered=true;data.system=null;data.connected=true;setScene('mac')};document.querySelector('#restart').onclick=boot;
document.querySelector('#scenario').onchange=e=>{data.scenario=e.target.value;data.message={ready:'',unknown:'主题未确认，请重新读取；旧固件可能需要升级。',offline:'连接键盘后读取主题。',fail:''}[data.scenario];render()};document.querySelector('#back').onclick=()=>{data.editing=false;render()};document.querySelector('#write').onclick=submitDraft;setInterval(drawScreen,180);render();
</script></html>
