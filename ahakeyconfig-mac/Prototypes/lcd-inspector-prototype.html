<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>LCD 侧栏原型 · 不连接键盘</title>
<!-- THROWAWAY: three LCD sidebar variants in the existing native-app context.
Run: python3 -m http.server 18763 --bind 127.0.0.1 --directory ahakeyconfig-mac/Prototypes
?variant=A/B/C. In-memory only, no real mutations. User requires connect&talk only;
retain this source here rather than creating another branch. Not part of App packaging. -->
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit;color:inherit;cursor:pointer}button{border:0;background:#353535;border-radius:8px;padding:9px 12px}button:hover{filter:brightness(1.17)}button:disabled{opacity:.4;cursor:default}.app{height:calc(100vh - 66px);margin:16px 22px 50px;background:#202020;border:1px solid #444;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}header{flex-shrink:0;height:72px;display:flex;align-items:center;gap:32px;border-bottom:1px solid #363636;padding:0 26px}h1{font-size:22px;margin:0}header small{color:#a2a2a2}i.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffac42;margin-left:5px}.green{color:#45d18c}.content{display:grid;grid-template-columns:minmax(350px,1fr) 390px;flex:1;min-height:0}.canvas{padding:34px;display:flex;flex-direction:column;gap:20px;background:#1c1c1c}h2{font-size:20px;margin:0 0 4px}h3{font-size:14px;margin:0}p{margin:4px 0;color:#aaa;font-size:12px;line-height:1.5}.mode-tabs,.segmented{display:flex;background:#141414;border:1px solid #414141;border-radius:9px;padding:3px;gap:3px}.segmented button,.mode-tabs span{flex:1;background:none;text-align:center;border-radius:6px;padding:7px;font-size:12px}.selected{background:#345b8b!important;color:white!important}.keyboard{margin:auto 0;background:#e6e7ea;color:#333;border-radius:26px;padding:34px 28px;box-shadow:inset 0 0 0 2px #a7a8ad}.keyboard-top{display:flex;justify-content:space-between;gap:25px;align-items:center}.strip{background:linear-gradient(90deg,#e6534c,#e3d34d,#5acb81,#347ec9);height:14px;border-radius:20px;flex:1}.screen{width:150px;height:80px;display:grid;place-content:center;background:#111;border-radius:10px;font-size:35px;border:3px solid #348fff}.keys{display:flex;gap:14px;margin-top:60px}.keys span{height:90px;flex:1;background:#f6f6f7;border-radius:17px;display:grid;place-content:center;font-size:30px;box-shadow:0 8px 10px #0002}.aside{border-left:1px solid #393939;display:flex;flex-direction:column;min-height:0}.aside-head{padding:22px 20px 14px}.scroll{padding:0 20px 18px;overflow:auto;flex:1}.module{margin:0 0 16px;border:1px solid #393939;border-radius:12px;padding:13px;background:#252525}.module-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.badge{font-size:10px;color:#b7b7b7;background:#343434;border-radius:5px;padding:3px 6px}.cards{display:grid;gap:8px;grid-template-columns:1fr 1fr}.choice{padding:10px;text-align:left;background:#2c2c2c;border:1px solid #444;border-radius:9px;min-height:62px}.choice.active{background:#22364e;border-color:#5b9bf3}.choice b{display:block;font-size:13px}.choice p{font-size:11px;margin-top:3px}.states{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0}.states.three{grid-template-columns:repeat(3,1fr)}.state{background:#2b2b2b;border:1px solid #414141;border-radius:8px;padding:8px;text-align:left;min-width:0}.state.active{border-color:#5b9bf3;background:#23364e}.thumb{height:30px;background:#1c1c1c;border-radius:5px;display:grid;place-content:center;margin-bottom:6px;font-size:18px}.state small{font-size:10px;color:#aaa;display:block;margin-top:3px}.preview{background:#171717;border:1px dashed #555;border-radius:9px;height:76px;display:grid;place-content:center;text-align:center;font-size:27px;margin:10px 0}.file-row,.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.file-row{font-size:11px;color:#bbb}.link{background:none;padding:3px;color:#8db7ff;font-size:11px}.secondary{font-size:11px;color:#aaa;margin-top:8px}.toggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}.task{display:flex;align-items:center;justify-content:space-between;padding-top:8px;font-size:12px}.status{color:#74bdff;font-size:11px}.footer{padding:12px 20px 16px;border-top:1px solid #3b3b3b;background:#242424}.footer p{margin:0 0 9px;font-size:11px}.footer-actions{display:flex;justify-content:space-between;gap:12px}.primary{background:#287ce2;font-weight:600}.footer .primary{min-width:145px}.switcher{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#f3f3f3;color:#222;padding:5px;border-radius:25px;box-shadow:0 5px 22px #0008;display:flex;align-items:center;gap:10px;font-size:12px}.switcher button{border-radius:20px;background:#ddd;color:#222;padding:7px 12px}.prototype-state{padding:12px;border:1px dashed #494949;border-radius:8px;color:#999;font-size:11px;line-height:1.6}.top-note{color:#999;font-size:11px}.steps button{width:100%;display:flex;justify-content:space-between;background:#2a2a2a;margin-bottom:7px;text-align:left}.steps button.active{border-left:3px solid #62a2ff;background:#283a50}.summary{padding:14px;border-radius:10px;background:#292929;margin-bottom:12px}.summary b{font-size:13px}.empty-task{padding-top:8px}.compact-title{margin:14px 0 10px}.toast{position:fixed;top:30px;left:45%;background:#e5f6e9;color:#183d24;border-radius:9px;padding:12px 18px;z-index:5;box-shadow:0 5px 20px #0007}@media(max-width:850px){.canvas{display:none}.content{grid-template-columns:1fr}.aside{width:min(100%,440px);margin:0 auto;border:0;height:100%}.app{margin:10px 10px 60px}header{gap:12px;padding:0 18px}h1{font-size:18px}}
</style>
<div class="app"><header><h1>AhaKey Studio</h1><small><span class="green">●</span> 已连接</small><small>82% · 自动批准</small><small style="margin-left:auto">原型 · 不连接键盘</small></header><div class="content"><main class="canvas"><h2>Keyboard Mode</h2><div class="mode-tabs"><span>Claude</span><span>Cursor</span><span class="selected">Codex</span><span>Kimi</span></div><p>点选组件，在右侧修改。</p><div class="keyboard"><div class="keyboard-top"><div class="strip"></div><div class="screen">🦀</div></div><div class="keys"><span>♩</span><span>✓</span><span>×</span><span>⌫</span></div></div><div class="prototype-state" id="state"></div></main><aside class="aside"><div class="aside-head"><h2>▣ 屏幕画面</h2><p id="subtitle">选择画面与展示方式</p></div><div class="scroll" id="editor"></div><div class="footer" id="footer"></div></aside></div></div><nav class="switcher"><button id="prev">←</button><span id="variantLabel"></span><button id="next">→</button></nav>
<script>
let variant=new URLSearchParams(location.search).get('variant')||'A';let data={mode:'multi',scope:'mode',state:0,follow:false,artwork:false,modeDirty:false,section:'artwork',editing:true};const names={A:'分区平铺（推荐）',B:'素材／展示双标签',C:'步骤式展开'};
function modes(){return `<div class="module-title"><h3>展示方式</h3><span class="badge">本次连接</span></div><div class="cards">${[['single','▣ 单任务','显示最新任务状态'],['multi','▦ 多任务','最多4个独立会话']].map(([v,t,d])=>`<button class="choice ${data.mode===v?'active':''}" data-mode="${v}"><b>${t}${data.modeDirty&&data.mode===v?'<i class="dot"></i>':''}</b><p>${d}</p></button>`).join('')}</div>${data.mode==='multi'?`<label class="toggle"><input type="checkbox" id="follow" ${data.follow?'checked':''}> 跟随当前终端 <span class="badge" title="需允许读取Terminal或iTerm窗口状态">ⓘ</span></label>`:''}<p class="secondary">断线后需重新应用展示方式。</p>`}
function artwork(){let states=data.scope==='mode'?['默认画面','进行中','等待处理','已完成']:['进行中','等待处理','已完成'];if(data.state>=states.length)data.state=0;return `<div class="module-title"><h3>图片与动图</h3><button class="link" id="refreshArt" title="读取键盘素材信息">↻ 刷新</button></div><div class="segmented"><button data-scope="mode" class="${data.scope==='mode'?'selected':''}">单任务画面</button><button data-scope="multi" class="${data.scope==='multi'?'selected':''}">多任务画面</button></div><div class="states ${data.scope==='multi'?'three':''}">${states.map((s,i)=>`<button class="state ${data.state===i?'active':''}" data-state="${i}"><div class="thumb">${i===0&&data.artwork?'☕':'▧'}</div>${s}${data.artwork&&data.state===i?'<i class="dot"></i>':''}<small>${i===0?'自定义图片':'默认素材'}</small></button>`).join('')}</div><div class="preview">${data.artwork?'☕':'▧'}<p>${states[data.state]}</p></div><div class="file-row"><span>${data.artwork?'Clawd Coffee.jpeg':'使用键盘默认素材'}</span><span><button class="link" id="choose">选择图片／GIF</button> <button class="link" id="reset">使用默认</button></span></div><p class="secondary">自动适配尺寸 · 最多${data.state===0&&data.scope==='mode'?8:12}帧</p>`}
function tasks(){return `<div class="module-title"><h3>当前任务 <span class="badge">1</span></h3><button class="link" id="refreshTask" title="只读取任务，不更改键盘">↻ 刷新</button></div><div class="task"><span>Codex</span><span class="status">● 进行中</span></div>`}
function VariantA(){return `<section class="module">${modes()}</section><section class="module">${artwork()}</section><section class="module">${tasks()}</section>`}
function VariantB(){return `<div class="segmented" style="margin-bottom:16px"><button data-section="artwork" class="${data.section==='artwork'?'selected':''}">图片与动图</button><button data-section="display" class="${data.section==='display'?'selected':''}">展示设置</button></div>${data.section==='artwork'?artwork():modes()+'<div class="compact-title"></div>'+tasks()}`}
function VariantC(){return `<div class="steps"><button data-section="display" class="${data.section==='display'?'active':''}">① 展示方式 <span>${data.mode==='multi'?'多任务':'单任务'} ›</span></button>${data.section==='display'?'<section class="module">'+modes()+'</section>':''}<button data-section="artwork" class="${data.section==='artwork'?'active':''}">② 配置画面 <span>${data.scope==='mode'?'Codex':'多任务'} ›</span></button>${data.section==='artwork'?'<section class="module">'+artwork()+'</section>':''}<button data-section="tasks" class="${data.section==='tasks'?'active':''}">③ 查看任务 <span>1个 ›</span></button>${data.section==='tasks'?'<section class="module">'+tasks()+'</section>':''}</div>`}
function render(){document.getElementById('variantLabel').textContent=variant+' · '+names[variant];document.getElementById('editor').innerHTML=data.editing?({A:VariantA,B:VariantB,C:VariantC}[variant]||VariantA)():`<div class="summary"><b>屏幕素材</b><p>Codex · 默认画面</p><p>自定义图片 · 1帧</p></div><button class="primary" id="edit">修改</button>`;document.getElementById('footer').style.display=data.editing?'block':'none';document.getElementById('footer').innerHTML=`<p>${data.artwork||data.modeDirty?'待写入：'+[data.artwork?'当前画面':'',data.modeDirty?'展示设置':''].filter(Boolean).join('、'):'修改后在此统一写入'}</p><div class="footer-actions"><button id="back">返回</button><button class="primary" id="write" ${data.artwork||data.modeDirty?'':'disabled'}>写入键盘</button></div>`;document.getElementById('state').textContent='原型交互状态（不属于正式界面）：'+JSON.stringify(data);wire()}
function wire(){document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{data.mode=e.dataset.mode;data.modeDirty=true;render()});document.querySelectorAll('[data-scope]').forEach(e=>e.onclick=()=>{data.scope=e.dataset.scope;data.state=0;render()});document.querySelectorAll('[data-state]').forEach(e=>e.onclick=()=>{data.state=+e.dataset.state;render()});document.querySelectorAll('[data-section]').forEach(e=>e.onclick=()=>{data.section=e.dataset.section;render()});let on=(id,f)=>{let e=document.getElementById(id);if(e)e.onclick=f};on('choose',()=>{data.artwork=true;render()});on('reset',()=>{data.artwork=true;render()});on('back',()=>{data.editing=false;render()});on('edit',()=>{data.editing=true;render()});on('write',()=>{data.artwork=false;data.modeDirty=false;render();toast('原型演示：写入完成，可继续编辑或完成编辑')});on('refreshArt',()=>toast('原型演示：已读取素材'));on('refreshTask',()=>toast('原型演示：已读取任务'));let f=document.getElementById('follow');if(f)f.onchange=()=>{data.follow=f.checked;data.modeDirty=true;render()}}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}function change(d){let keys=['A','B','C'];variant=keys[(keys.indexOf(variant)+d+3)%3];let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});render();
</script></html>
