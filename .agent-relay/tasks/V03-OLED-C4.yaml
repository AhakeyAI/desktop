task_id: V03-OLED-C4
revision: "1"
lane: client
objective: Connect the accepted page-scoped Runtime operation model to Studio so users write only changed fields on the current editing page and see the existing device-level queue at the bottom.
completion_criteria:
  - "Each selectable editing page is one operation scope: key, light strip, screen, lever, power key, or another explicitly registered page."
  - The action writes every changed field on the current page and no field from another page; a strict zero diff is a no-op before CAS, WAL, or device I/O.
  - If both picture sets changed on the screen page, both are written and the currently selected set is activated.
  - The screen action is named 写入并激活 and successful completion makes the chosen picture visible.
  - While a page operation is running, that page is read-only and cannot be cancelled; other pages remain editable and may enqueue their own operations.
  - The existing bottom device-level FIFO is retained and shows operation identity, page scope, progress, terminal result, and exact residual facts.
  - Reconnection reflects Runtime durable state and offers retry only for residual facts; Studio never invents continuation state.
  - Targeted UI/store tests, the full Swift suite, App and Runtime Release builds, and git diff checks pass.
