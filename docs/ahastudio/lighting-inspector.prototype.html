<style>
*{box-sizing:border-box}body{margin:0;background:#141619;color:#eee;font:13px -apple-system,BlinkMacSystemFont,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}header{height:78px;border-bottom:1px solid #35373b;padding:24px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}header span{color:#b0b7bf;font-size:12px}.shell{display:grid;grid-template-columns:minmax(500px,1fr) 390px;height:calc(100vh - 78px)}main{padding:30px}.tabs{display:flex;gap:6px;margin:10px 0 75px}.tabs span{padding:7px 35px;background:#202328;border-radius:5px}.tabs .active{background:#213753;color:#a5c9ff}.keyboard{background:#e4e8ec;border-radius:28px;padding:40px 30px;box-shadow:inset 0 0 0 7px #f3f5f7;position:relative}.led{height:12px;border-radius:10px;background:#aab3bb;margin:10px 140px 80px 0}.screen{position:absolute;right:38px;top:40px;background:#050505;width:110px;height:76px;border:8px solid #222;border-radius:10px;text-align:center;padding:18px;color:#d1d8e3}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-right:80px}.key{background:#fafbfc;box-shadow:0 4px 9px #bbc1ca;border-radius:18px;height:95px;text-align:center;color:#39424d;padding-top:25px;font-size:27px}.preview-label{color:#bac3cf;text-align:center;margin:25px 0}.side{display:flex;flex-direction:column;border-left:1px solid #35373b;min-height:0}.scroll{overflow:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head h2{font-size:18px;margin:0}.refresh{border:0;background:transparent;color:#9ba5b2;font-size:20px}.mode{color:#a4adba}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}.state{border:0;background:#292c31;border-radius:6px;padding:7px;font-size:12px}.state.active{background:#25446b;color:#b8d8ff}.current{font-size:11px;color:#9fa9b6;margin:12px 0 20px}.effects-title{font-size:13px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.effect{background:#24272c;border:1px solid #3a3d44;border-radius:9px;padding:10px;text-align:left;position:relative;min-height:80px}.effect.selected{border-color:#72adff;background:#203650}.effect strong{font-size:12px;font-weight:600;display:block;padding-right:23px}.effect p{font-size:11px;line-height:1.5;color:#aab4c2;margin:6px 0 0}.play{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#a8cfff;font-size:17px;padding:2px}.brightness{margin-top:22px;border-top:1px solid #393c42;padding-top:15px}.brightness-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.brightness-head small{color:#9aa5b4}.brightness input{width:100%;accent-color:#6aaaff}.text-btn{background:transparent;border:0;color:#98c1fc;font-size:11px}.more{color:#9ca6b4;margin:18px 0 8px}.footer{border-top:1px solid #363940;display:flex;justify-content:space-between;gap:8px;padding:14px 20px}.footer button{border:1px solid #4b505b;border-radius:6px;background:#2c3037;padding:7px 11px}.footer .primary{background:#3977d2;border-color:#3977d2}.switcher{position:fixed;bottom:12px;left:calc((100% - 390px)/2);transform:translateX(-50%);display:flex;gap:15px;align-items:center;background:#f2f4f7;color:#1b2530;border-radius:30px;box-shadow:0 6px 25px #0008;padding:10px 16px}.switcher button{border:0;background:transparent;color:#222;font-size:18px}.list .effect{display:block;min-height:0;border:0;border-bottom:1px solid #3a3d44;border-radius:0;padding:12px 28px 12px 10px}.list .effect p{margin-top:3px}.list .effect.selected{border-left:3px solid #72adff}.dual{display:grid;grid-template-columns:76px 1fr;gap:12px}.dual .states{display:flex;flex-direction:column;margin:0}.dual .grid{display:block}.dual .effect{margin-bottom:8px}.muted{color:#98a3b2;font-size:11px}
</style><header><strong>AhaKey Studio</strong><span>● AhaKey 505C　　87%　　自动批准</span></header><div class="shell"><main><div class="tabs"><span>Claude</span><span>Cursor</span><span class="active">Codex</span><span>Kimi</span></div><div class="keyboard"><div class="led" id="led"></div><div class="screen">Codex</div><div class="keys"><div class="key">♩</div><div class="key">✓</div><div class="key">×</div><div class="key">⌫</div></div></div><div class="preview-label" id="preview">选择效果后，可逐项预览对比</div></main><aside class="side"><div class="scroll" id="panel"></div><div class="footer"><button>返回</button><button onclick="stopPreview()">停止预览</button><button class="primary" onclick="document.getElementById('preview').textContent='原型：已保存选择，不会写入键盘'">保存灯效</button></div></aside></div><nav class="switcher"><button onclick="cycle(-1)">←</button><span id="variant-label"></span><button onclick="cycle(1)">→</button></nav>
<script>const effects=[{"id": "off", "name": "熄灭", "detail": "不点亮灯条。"}, {"id": "middleLight", "name": "中间停住", "detail": "中间最亮，两侧渐弱，适合停住提示。"}, {"id": "singleMove", "name": "来回流水", "detail": "单点来回移动，适合运行中。"}, {"id": "breathing", "name": "整条呼吸", "detail": "整条均匀起伏，适合等待确认。"}, {"id": "rainbowMove", "name": "彩虹流水", "detail": "彩色单点流水，更活跃。"}, {"id": "rainbowWave", "name": "彩虹波浪", "detail": "整条彩色流动，更显眼。"}, {"id": "rainbowWaveSlow", "name": "彩虹慢波浪", "detail": "比普通彩虹波浪更慢，适合做氛围效果。"}, {"id": "typingRipple", "name": "打字涟漪", "detail": "从中心向两侧扩散的涟漪效果。"}, {"id": "comet", "name": "彗星拖尾", "detail": "带拖尾的单向扫过，像彗星。"}, {"id": "scanBar", "name": "扫描条", "detail": "3 灯一组左右扫描。"}, {"id": "pulseCenter", "name": "中心脉冲", "detail": "中心快速脉冲扩散。"}, {"id": "warningBlink", "name": "警告闪烁", "detail": "橙色快速闪烁，适合警告。"}, {"id": "successSweep", "name": "成功扫过", "detail": "绿色从左到右逐渐点亮。"}, {"id": "blueThinking", "name": "蓝色思考", "detail": "蓝色呼吸波浪，适合思考中。"}, {"id": "lowBattery", "name": "低电量", "detail": "红色慢闪，表示低电量。"}, {"id": "chargingFlow", "name": "充电流动", "detail": "绿色填充流动，表示充电中。"}, {"id": "approvalWait", "name": "等待审批", "detail": "琥珀色呼吸 + 中心闪烁，等待用户操作。"}];const variants=['A','B','C'];const names={A:'平铺卡片',B:'清单对比',C:'双栏侧选'};const states=['通知','等待授权','工具完毕','工具执行','会话开始','停止','任务完成','用户提交','会话结束'];let selected='pulseCenter',state=0;let variant=new URL(location.href).searchParams.get('variant')||'A';if(!variants.includes(variant))variant='A';
function stateButtons(){return '<div class="states">'+states.map((s,i)=>'<button class="state '+(state===i?'active':'')+'" onclick="state='+i+';render()">'+s+'</button>').join('')+'</div>'}
function effectCards(){return effects.map(e=>"<div class='effect "+(selected===e.id?"selected":"")+"' data-effect='"+e.id+"'><strong>"+e.name+"</strong><p>"+e.detail+"</p>"+(e.id==="off"?"":"<button class='play' aria-label='Preview' data-preview='"+e.id+"'>⊙</button>")+"</div>").join("")}
function render(){let controls=stateButtons(),cards="<div class='grid'>"+effectCards()+"</div>";let content=variant==="C"?"<div class='dual'>"+controls+cards+"</div>":controls+"<div class='current'>键盘当前：中心脉冲</div><div class='effects-title'>选择灯效</div><div class='"+(variant==="B"?"list":"grid")+"'>"+effectCards()+"</div>";document.getElementById("panel").innerHTML="<div class='head'><h2>灯条</h2><button class='refresh' aria-label='刷新'>↻</button></div><span class='mode'>Codex</span>"+content+"<div class='brightness'><div class='brightness-head'><span>亮度 <small>全部模式</small></span><span id='brightness'>35%</span><button class='text-btn'>保存亮度</button></div><input class='bright-input' type='range' min='1' max='100' value='35'></div><details class='more'><summary>更多</summary><p class='muted'>查看全部模式设置 · 放弃未保存的修改</p></details>";document.getElementById("variant-label").textContent="原型 "+variant+" · "+names[variant]}
document.getElementById("panel").addEventListener("click",e=>{let play=e.target.closest("[data-preview]");if(play){preview(play.dataset.preview);return}let card=e.target.closest("[data-effect]");if(card){selected=card.dataset.effect;render()}});
document.getElementById("panel").addEventListener("input",e=>{if(e.target.classList.contains("bright-input"))document.getElementById("brightness").textContent=e.target.value+"%"});
function preview(id){selected=id;render();let e=effects.find(e=>e.id===id);document.getElementById('led').style.background='linear-gradient(90deg,#20342b,#68c397,#a9e6bd,#68c397,#20342b)';document.getElementById('preview').textContent='预览：'+e.name+'（原型，不连接键盘）'}function stopPreview(){document.getElementById('led').style.background='#aab3bb';document.getElementById('preview').textContent='预览已停止'}function cycle(step){variant=variants[(variants.indexOf(variant)+step+3)%3];let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();</script></html>
